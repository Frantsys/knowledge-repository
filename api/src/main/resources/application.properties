spring.application.name=knowledge-repository
server.port=${PORT:8080}

# Spring .ENV
spring.config.import=optional:file:.env[.properties]

# Spring Database Config
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5434}/${POSTGRES_DB:knowledge-repository-db}}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool de conexões: ajuste DB_POOL_SIZE ao limite de conexões do plano do Postgres/Supabase
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

# Spring JPA Config
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
# Services já são @Transactional e mapeiam para DTO lá dentro: não segura conexão do pool durante a escrita da resposta
spring.jpa.open-in-view=false

# Spring Security User
spring.security.user.name=${SPRING_USER:admin}
spring.security.user.password=${SPRING_PASSWORD:admin123}

# Spring Docker Compose
spring.docker.compose.enabled=false

# Liquibase Config
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Spring JWT Token Config
app.security.jwt.secret=${JWT_SECRET:2vA7f8SSWLeMBfHgsDMTNKZfDYZjLN2T79stiMrNuWe3XMZhHQSg1j6uncfXgznfJQJkKskaQWYQgiRrkMIXKR}
app.security.jwt.expiration=${JWT_EXPIRATION:24}

# Server
# Threads virtuais (Java 21): a API passa a maior parte do tempo esperando banco e Supabase
spring.threads.virtual.enabled=true
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/plain
server.compression.min-response-size=1KB

# Spring MVC
spring.mvc.problemdetails.enabled=true
# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# File upload / storage
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.storage.location=${STORAGE_LOCATION:./uploads}
app.storage.type=${STORAGE_TYPE:local}
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.supabase.bucket=${SUPABASE_BUCKET:files}

# CORS (separe varias origens por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
