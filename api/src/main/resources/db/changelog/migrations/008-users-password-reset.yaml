databaseChangeLog:
  # Redefinição de senha: só o hash (SHA-256) do token fica no banco, com prazo de validade
  - changeSet:
      id: 008-users-password-reset
      author: francis
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: reset_token_hash
                  type: VARCHAR(64)
              - column:
                  name: reset_token_expires_at
                  type: TIMESTAMP
        - createIndex:
            tableName: users
            indexName: uq_users_reset_token_hash
            unique: true
            columns:
              - column:
                  name: reset_token_hash
