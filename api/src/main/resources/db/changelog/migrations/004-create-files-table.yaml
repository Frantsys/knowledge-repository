databaseChangeLog:
  - changeSet:
      id: 004-create-files-table
      author: francis
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: material_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: path_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: read_only
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: files
            baseColumnNames: material_id
            referencedTableName: materials
            referencedColumnNames: id
            constraintName: fk_files_material