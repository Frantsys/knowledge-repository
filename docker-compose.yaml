services:

  postgres:
    image: postgres:16
    container_name: knowledge-repository-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    container_name: knowledge-repository-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_LOCATION: /app/uploads
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      CORS_ALLOWED_ORIGINS: http://localhost:${UI_PORT}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-Banca de Materiais <no-reply@banca.local>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${UI_PORT}}
    volumes:
      - uploads_data:/app/uploads
    # Pronta = o /health responde (a API leva alguns segundos para subir e rodar as migrações)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/v1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "${SPRING_PORT}:8080"
  ui:
    build:
      context: ./ui
      dockerfile: dockerfile
    container_name: knowledge-repository-ui
    depends_on:
      api:
        condition: service_healthy
    environment:
      # O container roda "npm run dev": com NODE_ENV=production o next dev deixa de achar rotas aninhadas (ex.: /materiais/[id]/editar dava 404)
      NODE_ENV: development
      PORT: "3000"
      # O navegador chama a API pelo host, não pelo nome do container
      NEXT_PUBLIC_API_URL: http://localhost:${SPRING_PORT}
    ports:
      - "${UI_PORT}:3000"
    volumes:
      - ./ui:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  uploads_data: