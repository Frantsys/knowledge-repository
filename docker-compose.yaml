services:

  postgres:
    image: postgres:16
    container_name: knowledge-repository-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    container_name: knowledge-repository-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${SPRING_PORT}:8080"
  ui:
    build:
      context: ./ui
      dockerfile: dockerfile
    container_name: knowledge-repository-ui
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "${UI_PORT}:3000"
    volumes:
      - ./ui:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data: